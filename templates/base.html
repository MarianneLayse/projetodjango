{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Agenda em Django!</title>

    <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script src="{% static 'js/jquery-4.0.0.js' %}"></script>
</head>

<body>

<!-- NAVBAR (FORA DO BLOCK) -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="{% url 'index_pontos' %}">Home</a>

        <a class="navbar-brand" href="{% url 'listar_pontos' %}">Pontos turísticos</a>

        <a class="navbar-brand" href="{% url 'listar_estados' %}">Estados</a>

        <a class="navbar-brand" href="{% url 'listar_municipios' %}">Municípios</a>

        <a class="navbar-brand" href="{% url 'listar_bairros' %}">Bairros</a>

    </div>
</nav>

<!-- CONTEÚDO VARIÁVEL -->
<main class="container py-4">

    <div class="mb-4">
        <h1 class="h1">
            {% block titulo %}
            {% endblock %}
        </h1>
    </div>

    {% block conteudo %}
    {% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
