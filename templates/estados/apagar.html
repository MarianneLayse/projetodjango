{% extends 'base.html' %}

{% block titulo %}
    Apagar Estado:
{% endblock %}

{% block conteudo %}
<div class="row">
    <dl>
        <div class="col-md-4">
            <dt>Nome:</dt>
            <dd>{{ estado.nome }}</dd>
        </div>

        <div class="col-md-4">
            <dt>Sigla:</dt>
            <dd>{{ estado.sigla }}</dd>
        </div>

        <div class="col-md-4">
            <dt>Região:</dt>
            <dd>{{ estado.get_regiao_display }}</dd>
        </div>

    </dl> 
</div>

<form method="POST">
    {% csrf_token %}

    <div class="row">
        <div class="col-md-12">
            <button class="btn btn-danger" type="submit">Confirmar exclusão</button>
            <a class='btn btn-secondary' href="{% url 'listar_estados' %}">Cancelar</a>
        </div>
    </div>
</form>
{% endblock %}
